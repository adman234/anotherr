name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly rebuild so the image picks up security fixes in the CUDA/Ubuntu base
  # image even when nothing here changes. Layers are reused from the registry
  # cache, so if the base image hasn't changed the rebuild changes nothing.
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the python3 in the ubuntu24.04 base image
          cache: pip
      - name: System tools the tests need (without them the media tests are skipped)
        timeout-minutes: 8  # a hung Ubuntu mirror should fail fast, not block a merge for half an hour
        run: |
          for attempt in 1 2; do
            sudo timeout 180 apt-get update -o Acquire::Retries=3 \
              && sudo timeout 240 apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
                 ffmpeg tesseract-ocr fonts-dejavu-core mkvtoolnix && exit 0
            echo "apt attempt $attempt failed, retrying on the main Ubuntu archive"; sleep 10
            # the runner's Azure mirror sometimes stops answering for hours; fall back to the main archive
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g'               /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          done
          exit 1
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -rs

  build:
    needs: test
    # Pull requests only run the tests; images are published from main and tags.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (CUDA base image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - id: build
        run: echo "id=$(echo ${{ github.sha }} | cut -c1-7) $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"
      # The registry cache keeps unchanged layers byte-identical between builds,
      # so Unraid only re-downloads the layers that actually changed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ANOTHERR_BUILD=${{ steps.build.outputs.id }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
